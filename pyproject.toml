[project]
name = "k4-day07-data-foundations"
version = "0.1.0"
description = "Lab 7: Data foundations, embeddings, vector stores, and RAG"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
local = [
    "sentence-transformers==5.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
